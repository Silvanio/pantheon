server:
  port: 8082

spring:
  application:
    name: pantheon-message
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/pantheon_message}
    username: ${SPRING_DATASOURCE_USERNAME:pantheon}
    password: ${SPRING_DATASOURCE_PASSWORD:pantheon}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:pantheon}
    password: ${SPRING_RABBITMQ_PASSWORD:pantheon}
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

pantheon:
  api-token: ${PANTHEON_API_TOKEN:dev-shared-api-token}
  mail:
    from: ${PANTHEON_MAIL_FROM:no-reply@pantheon.local}
  web:
    base-url: ${PANTHEON_WEB_BASE_URL:http://localhost:8080}
