name: pantheon_mobile
description: "Pantheon mobile app — construction-management on the go."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Networking
  dio: ^5.9.0

  # Secure token storage (platform keychain/keystore)
  flutter_secure_storage: ^9.2.4

  # Camera / gallery photo capture for Diário de Obra
  image_picker: ^1.1.2

  # Push notifications
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1

  # Error tracking / crash reporting + navigation breadcrumbs (see
  # openspec/changes/add-sentry-error-tracking/). No-op unless SENTRY_DSN is set — see main.dart.
  sentry_flutter: ^9.30.1

  # Formatting (dates, numbers)
  intl: ^0.20.2

  # Pull-to-refresh / pagination niceties
  cached_network_image: ^3.4.1

  # Offline support: local cache of last-known API responses + a pending-actions
  # outbox synced when connectivity returns (see lib/core/offline/).
  sqflite: ^2.4.2
  path: ^1.9.1
  connectivity_plus: ^6.1.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Generates the native (OS-level) launch screen for iOS/Android from the config below —
  # `dart run flutter_native_splash:create` regenerates it after an icon/color change.
  flutter_native_splash: ^2.4.4

# Native launch screen shown before Flutter's first frame — necessarily static (no OS supports
# animating it), so it only carries the background color + centered icon. The animated,
# copy-carrying splash (logo entrance, tagline) is a real Flutter screen instead — see
# lib/features/auth/splash_screen.dart, shown immediately after via the /splash route.
flutter_native_splash:
  color: "#0B0F1F"
  image: assets/images/splash_icon.png
  android_12:
    color: "#0B0F1F"
    image: assets/images/splash_icon_android12.png

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 500
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 600
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 700
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 800
